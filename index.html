<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LackerHost</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
    --bg: #0f1115;
    --surface: #181a20;
    --surface2: #22252e;
    --border: #2a2d38;
    --text: #f2f2f4;
    --text-dim: #8b8f99;
    --accent: #4DA6FF;
    --accent-dim: rgba(77, 166, 255, 0.15);
    --danger: #ff4757;
    --success: #2ed573;
    --warning: #ffa502;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
.hidden { display: none !important; }

.header { padding: 20px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.header-actions { display: flex; gap: 12px; }
.lang-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.lang-btn:hover { border-color: var(--accent); }

.main { flex: 1; overflow-y: auto; padding: 24px; padding-bottom: 100px; }
.projects-header { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.projects-counter { font-size: 13px; color: var(--text-dim); font-weight: 500; }

.project-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: all 0.2s; }
.project-card:hover { border-color: var(--accent); background: var(--surface2); }
.project-card:active { transform: scale(0.98); }
.project-icon { width: 48px; height: 48px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.project-icon img { width: 32px; height: 32px; object-fit: contain; }
.project-info { flex: 1; min-width: 0; }
.project-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.project-desc { font-size: 13px; color: var(--text-dim); }
.project-status { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; }
.status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
.status-dot.offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.status-dot.starting { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.status-text { font-size: 13px; font-weight: 600; }
.status-text.online { color: var(--success); }
.status-text.offline { color: var(--danger); }
.status-text.starting { color: var(--warning); }

.fab { position: fixed; bottom: 32px; right: 32px; width: 60px; height: 60px; border-radius: 50%; background: #ffffff; border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 50; }
.fab:hover { transform: scale(1.1); }
.fab:active { transform: scale(0.95); }
.fab svg { width: 28px; height: 28px; stroke: #000000; stroke-width: 2.5; }

.editor-view { display: flex; flex-direction: column; height: 100%; }
.editor-toolbar { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
.toolbar-btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.toolbar-btn:hover { border-color: var(--accent); }
.toolbar-btn:active { transform: scale(0.95); }
.toolbar-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.toolbar-btn.warning { background: var(--warning); border-color: var(--warning); color: #000; }
.toolbar-spacer { flex: 1; }

.editor-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#codeEditor { flex: 1; width: 100%; padding: 20px; background: var(--bg); color: var(--text); border: none; outline: none; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; resize: none; tab-size: 4; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 20px; }
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; transform: scale(0.9); transition: transform 0.3s; }
.modal-overlay.active .modal { transform: scale(1); }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; }
.form-input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
.form-input:focus { border-color: var(--accent); }
.form-select { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 14px; outline: none; cursor: pointer; }

.modal-btn { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: all 0.2s; text-align: left; display: flex; align-items: center; gap: 10px; }
.modal-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
.modal-btn:active { transform: scale(0.98); }
.modal-btn.danger { border-color: var(--danger); }
.modal-btn.danger:hover { background: rgba(255, 71, 87, 0.1); }
.modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; text-align: center; justify-content: center; }

/* Terminal */
.terminal-container { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; max-height: 400px; overflow-y: auto; color: #e0e0e0; }
.terminal-line { margin-bottom: 2px; word-break: break-word; white-space: pre-wrap; }
.terminal-line.system { color: var(--text-dim); font-style: italic; }
.terminal-line.user-cmd { color: var(--accent); }
.terminal-input-row { display: flex; gap: 8px; margin-top: 12px; }
.terminal-input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none; }
.terminal-input:focus { border-color: var(--accent); }
.terminal-input:disabled { opacity: 0.4; cursor: not-allowed; }
.terminal-send-btn { padding: 10px 16px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.terminal-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Env vars */
.env-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--surface2); border-radius: 10px; margin-bottom: 8px; }
.env-name { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: var(--accent); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.env-value { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.env-value.shown { color: var(--text); }
.env-actions { display: flex; gap: 4px; flex-shrink: 0; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.empty-state-text { font-size: 14px; }
</style>
</head>
<body>

<div id="mainView">
    <div class="header">
        <div class="logo">LackerHost</div>
        <div class="header-actions">
            <button class="lang-btn" id="langBtn" onclick="openLangModal()">ENG</button>
        </div>
    </div>
    <div class="main">
        <div class="projects-header">
            <span data-i18n="projects">Projects</span>
            <span class="projects-counter" id="projectsCounter">0 / 3</span>
        </div>
        <div id="projectsList"></div>
        <div id="emptyState" class="empty-state hidden">
            <div class="empty-state-title" data-i18n="noProjects">No projects</div>
            <div class="empty-state-text" data-i18n="createFirst">Create your first project</div>
        </div>
    </div>
    <button class="fab" onclick="openCreateModal()">
        <svg viewBox="0 0 24 24" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
</div>

<div id="editorView" class="hidden editor-view">
    <div class="editor-toolbar">
        <button class="toolbar-btn" onclick="goBack()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            <span data-i18n="back">Back</span>
        </button>
        <button class="toolbar-btn" onclick="openToolsModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            <span data-i18n="tools">Tools</span>
        </button>
        <button class="toolbar-btn" onclick="openTerminalModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <span data-i18n="terminal">Terminal</span>
        </button>
        <button class="toolbar-btn" onclick="openEnvModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>ENV</span>
        </button>
        <div class="toolbar-spacer"></div>
        <button class="toolbar-btn warning hidden" id="restartBtn" onclick="restartProject()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            <span data-i18n="restart">Restart</span>
        </button>
        <button class="toolbar-btn primary" id="runBtn" onclick="toggleProject()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span id="runBtnText" data-i18n="run">Run</span>
        </button>
    </div>
    <div class="editor-container">
        <textarea id="codeEditor" placeholder="# Enter your Python code here..."></textarea>
    </div>
</div>

<!-- Create Modal -->
<div class="modal-overlay" id="createModal">
    <div class="modal">
        <div class="modal-title" data-i18n="createProject">Create Project</div>
        <div class="form-group">
            <label class="form-label" data-i18n="projectName">Project Name</label>
            <input type="text" class="form-input" id="projectNameInput" maxlength="20" placeholder="my-project">
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="topic">Topic</label>
            <select class="form-select" id="projectTypeSelect">
                <option value="python">Python</option>
            </select>
        </div>
        <button class="modal-btn primary" onclick="createProject()" data-i18n="create">Create</button>
        <button class="modal-btn" onclick="closeModal('createModal')" data-i18n="cancel">Cancel</button>
    </div>
</div>

<!-- Rename Modal -->
<div class="modal-overlay" id="renameModal">
    <div class="modal">
        <div class="modal-title" data-i18n="renameProject">Rename Project</div>
        <div class="form-group">
            <label class="form-label" data-i18n="newName">New Name</label>
            <input type="text" class="form-input" id="renameInput" maxlength="20">
        </div>
        <button class="modal-btn primary" onclick="confirmRename()" data-i18n="rename">Rename</button>
        <button class="modal-btn" onclick="closeModal('renameModal')" data-i18n="cancel">Cancel</button>
    </div>
</div>

<!-- Env Var Modal -->
<div class="modal-overlay" id="envVarModal">
    <div class="modal">
        <div class="modal-title" id="envVarTitle">Environment Variable</div>
        <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" class="form-input" id="envVarName" placeholder="MY_VAR">
        </div>
        <div class="form-group">
            <label class="form-label">Value</label>
            <input type="text" class="form-input" id="envVarValue" placeholder="value">
        </div>
        <button class="modal-btn primary" onclick="saveEnvVar()">Save</button>
        <button class="modal-btn" onclick="closeModal('envVarModal')">Cancel</button>
    </div>
</div>

<!-- Language Modal -->
<div class="modal-overlay" id="langModal">
    <div class="modal">
        <div class="modal-title" data-i18n="selectLanguage">Select Language</div>
        <button class="modal-btn" onclick="setLanguage('en')">English</button>
        <button class="modal-btn" onclick="setLanguage('ru')">Русский</button>
        <button class="modal-btn" onclick="setLanguage('uk')">Українська</button>
        <button class="modal-btn" onclick="closeModal('langModal')" data-i18n="cancel">Cancel</button>
    </div>
</div>

<!-- Tools Modal -->
<div class="modal-overlay" id="toolsModal">
    <div class="modal">
        <div class="modal-title" data-i18n="tools">Tools</div>
        <button class="modal-btn" onclick="openRenameModal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span data-i18n="renameProject">Rename project</span>
        </button>
        <button class="modal-btn danger" onclick="clearAndStop()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span data-i18n="clearAndStop">Clear code and stop</span>
        </button>
        <button class="modal-btn danger" onclick="deleteProject()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
            <span data-i18n="deleteProject">Delete project</span>
        </button>
        <button class="modal-btn" onclick="closeModal('toolsModal')" data-i18n="cancel">Cancel</button>
    </div>
</div>

<!-- Terminal Modal -->
<div class="modal-overlay" id="terminalModal">
    <div class="modal" style="max-width: 700px;">
        <div class="modal-title" data-i18n="terminal">Terminal</div>
        <div class="terminal-container" id="terminalContainer">
            <div class="terminal-line system">Waiting for logs...</div>
        </div>
        <div class="terminal-input-row">
            <input type="text" class="terminal-input" id="terminalInput" placeholder="Enter command..." disabled>
            <button class="terminal-send-btn" id="terminalSendBtn" onclick="sendCommand()" disabled>Send</button>
        </div>
        <button class="modal-btn" onclick="closeModal('terminalModal')" style="margin-top: 16px;" data-i18n="close">Close</button>
    </div>
</div>

<!-- Env Modal -->
<div class="modal-overlay" id="envModal">
    <div class="modal" style="max-width: 600px;">
        <div class="modal-title">Environment Variables</div>
        <button class="modal-btn primary" onclick="openEnvVarModal()" style="margin-bottom: 16px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Create variable</span>
        </button>
        <div id="envList"></div>
        <button class="modal-btn" onclick="closeModal('envModal')" style="margin-top: 16px;" data-i18n="close">Close</button>
    </div>
</div>

<script>
const firebaseConfig = { databaseURL: "https://lackerteam-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const PROJECT_LIMIT = 3;

const translations = {
    en: {
        projects: "Projects", noProjects: "No projects", createFirst: "Create your first project",
        back: "Back", tools: "Tools", terminal: "Terminal", run: "Run", stop: "Stop",
        restart: "Restart", createProject: "Create Project", projectName: "Project Name",
        topic: "Topic", create: "Create", cancel: "Cancel", selectLanguage: "Select Language",
        clearAndStop: "Clear code and stop", deleteProject: "Delete project", renameProject: "Rename Project",
        newName: "New Name", rename: "Rename", close: "Close", pythonProject: "Python project",
        nameExists: "Project name already exists", nameEmpty: "Project name cannot be empty",
        limitReached: "Project limit reached (max 3)",
        confirmClear: "Clear code and stop project?", confirmDelete: "Delete project? This action cannot be undone.",
        confirmRename: "Rename project?"
    },
    ru: {
        projects: "Проекты", noProjects: "Нет проектов", createFirst: "Создайте свой первый проект",
        back: "Назад", tools: "Инструменты", terminal: "Терминал", run: "Запустить", stop: "Остановить",
        restart: "Перезапустить", createProject: "Создать проект", projectName: "Имя проекта",
        topic: "Тематика", create: "Создать", cancel: "Отмена", selectLanguage: "Выберите язык",
        clearAndStop: "Очистить код и остановить", deleteProject: "Удалить проект", renameProject: "Переименовать проект",
        newName: "Новое имя", rename: "Переименовать", close: "Закрыть", pythonProject: "Python проект",
        nameExists: "Имя проекта уже существует", nameEmpty: "Имя проекта не может быть пустым",
        limitReached: "Достигнут лимит проектов (макс. 3)",
        confirmClear: "Очистить код и остановить проект?", confirmDelete: "Удалить проект? Это действие нельзя отменить.",
        confirmRename: "Переименовать проект?"
    },
    uk: {
        projects: "Проекти", noProjects: "Немає проектів", createFirst: "Створіть свій перший проект",
        back: "Назад", tools: "Інструменти", terminal: "Термінал", run: "Запустити", stop: "Зупинити",
        restart: "Перезапустити", createProject: "Створити проект", projectName: "Ім'я проекту",
        topic: "Тематика", create: "Створити", cancel: "Скасувати", selectLanguage: "Виберіть мову",
        clearAndStop: "Очистити код і зупинити", deleteProject: "Видалити проект", renameProject: "Перейменувати проект",
        newName: "Нове ім'я", rename: "Перейменувати", close: "Закрити", pythonProject: "Python проект",
        nameExists: "Ім'я проекту вже існує", nameEmpty: "Ім'я проекту не може бути порожнім",
        limitReached: "Досягнуто ліміт проектів (макс. 3)",
        confirmClear: "Очистити код і зупинити проект?", confirmDelete: "Видалити проект? Цю дію не можна скасувати.",
        confirmRename: "Перейменувати проект?"
    }
};

let currentLang = 'en';
let userId = null;
let currentProjectId = null;
let currentProjectRef = null;
let logsListener = null;
let currentStatus = 'offline';
let envVarsCache = {};
let editingEnvVar = null;

const urlParams = new URLSearchParams(window.location.search);
userId = urlParams.get('id');
if (!userId) alert('User ID not specified in URL');

function t(key) { return translations[currentLang][key] || translations['en'][key] || key; }

function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.getElementById('langBtn').textContent = currentLang.toUpperCase();
}

async function loadLanguage() {
    const langSnap = await db.ref(`py/users/${userId}/lang`).once('value');
    currentLang = langSnap.val() || 'en';
    applyTranslations();
}

function setLanguage(lang) {
    currentLang = lang;
    db.ref(`py/users/${userId}/lang`).set(lang);
    applyTranslations();
    closeModal('langModal');
}

function openLangModal() { document.getElementById('langModal').classList.add('active'); }

function loadProjects() {
    db.ref(`py/users/${userId}/projects`).on('value', snapshot => {
        const projects = snapshot.val() || {};
        renderProjects(projects);
        document.getElementById('projectsCounter').textContent = `${Object.keys(projects).length} / ${PROJECT_LIMIT}`;
    });
}

function renderProjects(projects) {
    const list = document.getElementById('projectsList');
    const emptyState = document.getElementById('emptyState');
    list.innerHTML = '';
    const ids = Object.keys(projects);
    if (ids.length === 0) { emptyState.classList.remove('hidden'); return; }
    emptyState.classList.add('hidden');
    ids.forEach(id => {
        const p = projects[id];
        const card = document.createElement('div');
        card.className = 'project-card';
        card.onclick = () => openProject(id);
        const status = p.status || 'offline';
        card.innerHTML = `
            <div class="project-icon"><img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/python.svg" style="filter: invert(1);"></div>
            <div class="project-info">
                <div class="project-name">${id}</div>
                <div class="project-desc">${t('pythonProject')}</div>
            </div>
            <div class="project-status">
                <div class="status-dot ${status}"></div>
                <div class="status-text ${status}">${status}</div>
            </div>`;
        list.appendChild(card);
    });
}

function openCreateModal() {
    db.ref(`py/users/${userId}/projects`).once('value').then(snap => {
        const count = Object.keys(snap.val() || {}).length;
        if (count >= PROJECT_LIMIT) {
            alert(t('limitReached'));
            return;
        }
        document.getElementById('projectNameInput').value = '';
        document.getElementById('createModal').classList.add('active');
    });
}

async function createProject() {
    const name = document.getElementById('projectNameInput').value.trim();
    const type = document.getElementById('projectTypeSelect').value;
    if (!name) { alert(t('nameEmpty')); return; }
    const ref = db.ref(`py/users/${userId}/projects`);
    const snap = await ref.once('value');
    const projects = snap.val() || {};
    if (Object.keys(projects).length >= PROJECT_LIMIT) { alert(t('limitReached')); return; }
    if (projects[name]) { alert(t('nameExists')); return; }
    await ref.child(name).set({ type, status: 'offline', created: firebase.database.ServerValue.TIMESTAMP });
    closeModal('createModal');
}

function openProject(projectId) {
    currentProjectId = projectId;
    currentProjectRef = db.ref(`py/users/${userId}/projects/${projectId}`);
    document.getElementById('mainView').classList.add('hidden');
    document.getElementById('editorView').classList.remove('hidden');
    
    // Загружаем код из Firebase
    currentProjectRef.once('value').then(snap => {
        const p = snap.val() || {};
        document.getElementById('codeEditor').value = p.data_py || '';
        updateRunButton(p.status || 'offline');
    });
    
    currentProjectRef.on('value', snap => {
        const p = snap.val() || {};
        updateRunButton(p.status || 'offline');
        updateTerminalInput(p.status || 'offline');
    });
    
    if (logsListener) db.ref(`py/users/${userId}/projects/${projectId}/logs`).off('child_added', logsListener);
    logsListener = db.ref(`py/users/${userId}/projects/${projectId}/logs`).on('child_added', snap => {
        const l = snap.val();
        addTerminalLine(l.message, l.type);
        if (!document.getElementById('terminalModal').classList.contains('active')) {
            openTerminalModal();
        }
    });
}

function updateRunButton(status) {
    currentStatus = status;
    const btn = document.getElementById('runBtn');
    const restartBtn = document.getElementById('restartBtn');
    
    if (status === 'online') {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span id="runBtnText">${t('stop')}</span>`;
        restartBtn.classList.remove('hidden');
    } else if (status === 'starting') {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span id="runBtnText">${t('stop')}</span>`;
        restartBtn.classList.add('hidden');
    } else {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg><span id="runBtnText">${t('run')}</span>`;
        restartBtn.classList.add('hidden');
    }
}

function updateTerminalInput(status) {
    const input = document.getElementById('terminalInput');
    const btn = document.getElementById('terminalSendBtn');
    const enabled = status === 'online';
    input.disabled = !enabled;
    btn.disabled = !enabled;
    input.placeholder = enabled ? 'Enter command...' : 'Project is not running';
}

function toggleProject() {
    if (currentStatus === 'online' || currentStatus === 'starting') stopProject();
    else startProject();
}

async function startProject() {
    const code = document.getElementById('codeEditor').value;
    
    // Сохраняем код в Firebase
    await currentProjectRef.update({ data_py: code });
    
    // Очищаем логи и ставим статус
    db.ref(`py/users/${userId}/projects/${currentProjectId}/logs`).remove();
    document.getElementById('terminalContainer').innerHTML = '';
    currentProjectRef.update({ status: 'starting' });
}

function stopProject() {
    currentProjectRef.update({ status: 'offline' });
}

function restartProject() {
    currentProjectRef.update({ status: 'offline' });
    setTimeout(() => {
        startProject();
    }, 1500);
}

function goBack() {
    // Сохраняем код перед выходом
    const code = document.getElementById('codeEditor').value;
    currentProjectRef.update({ data_py: code });
    
    if (logsListener) {
        db.ref(`py/users/${userId}/projects/${currentProjectId}/logs`).off('child_added', logsListener);
        logsListener = null;
    }
    currentProjectRef.off();
    currentProjectRef = null;
    currentProjectId = null;
    document.getElementById('editorView').classList.add('hidden');
    document.getElementById('mainView').classList.remove('hidden');
    document.getElementById('terminalContainer').innerHTML = '<div class="terminal-line system">Waiting for logs...</div>';
}

function openToolsModal() { document.getElementById('toolsModal').classList.add('active'); }
function openTerminalModal() { 
    document.getElementById('terminalModal').classList.add('active');
    const container = document.getElementById('terminalContainer');
    container.scrollTop = container.scrollHeight;
}
function openRenameModal() {
    document.getElementById('renameInput').value = currentProjectId;
    closeModal('toolsModal');
    document.getElementById('renameModal').classList.add('active');
}

async function confirmRename() {
    const newName = document.getElementById('renameInput').value.trim();
    if (!newName) { alert(t('nameEmpty')); return; }
    if (newName === currentProjectId) { closeModal('renameModal'); return; }
    if (!confirm(t('confirmRename'))) return;
    
    const projectsRef = db.ref(`py/users/${userId}/projects`);
    const snap = await projectsRef.once('value');
    const projects = snap.val() || {};
    if (projects[newName]) { alert(t('nameExists')); return; }
    
    const oldData = projects[currentProjectId];
    await projectsRef.child(newName).set(oldData);
    await projectsRef.child(currentProjectId).remove();
    
    closeModal('renameModal');
    currentProjectId = newName;
    currentProjectRef = db.ref(`py/users/${userId}/projects/${newName}`);
}

function closeModal(id) { document.getElementById(id).classList.remove('active'); }

function clearAndStop() {
    if (!confirm(t('confirmClear'))) return;
    document.getElementById('codeEditor').value = '';
    currentProjectRef.update({ data_py: '', status: 'offline' });
    closeModal('toolsModal');
}

async function deleteProject() {
    if (!confirm(t('confirmDelete'))) return;
    try {
        await currentProjectRef.remove();
        closeModal('toolsModal');
        goBack();
    } catch (e) {
        console.error('Delete error:', e);
        alert('Error deleting project');
    }
}

// ===== ANSI PARSER =====
function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function parseAnsi(text) {
    const ansiRegex = /\x1b\[([0-9;]*)m/g;
    let result = '';
    let lastIndex = 0;
    let styles = [];
    let match;
    
    const fgColors = {
        '30': '#3a3a3a', '31': '#ff5555', '32': '#50fa7b', '33': '#f1fa8c',
        '34': '#bd93f9', '35': '#ff79c6', '36': '#8be9fd', '37': '#f8f8f2',
        '90': '#6272a4', '91': '#ff6e6e', '92': '#69ff94', '93': '#ffffa5',
        '94': '#d6acff', '95': '#ff92df', '96': '#a4ffff', '97': '#ffffff'
    };
    const bgColors = {
        '40': '#21222c', '41': '#ff5555', '42': '#50fa7b', '43': '#f1fa8c',
        '44': '#bd93f9', '45': '#ff79c6', '46': '#8be9fd', '47': '#f8f8f2',
        '100': '#6272a4', '101': '#ff6e6e', '102': '#69ff94', '103': '#ffffa5',
        '104': '#d6acff', '105': '#ff92df', '106': '#a4ffff', '107': '#ffffff'
    };
    
    while ((match = ansiRegex.exec(text)) !== null) {
        result += `<span style="${buildStyle(styles)}">${escapeHtml(text.slice(lastIndex, match.index))}</span>`;
        lastIndex = match.index + match[0].length;
        
        const codes = match[1].split(';').filter(c => c);
        if (codes.length === 0 || (codes.length === 1 && codes[0] === '')) {
            codes.push('0');
        }
        
        for (const code of codes) {
            const c = parseInt(code);
            if (c === 0) {
                styles = [];
            } else if (c === 1) {
                if (!styles.includes('bold')) styles.push('bold');
            } else if (c === 3) {
                if (!styles.includes('italic')) styles.push('italic');
            } else if (c === 4) {
                if (!styles.includes('underline')) styles.push('underline');
            } else if (fgColors[code]) {
                styles = styles.filter(s => !s.startsWith('fg:'));
                styles.push('fg:' + fgColors[code]);
            } else if (bgColors[code]) {
                styles = styles.filter(s => !s.startsWith('bg:'));
                styles.push('bg:' + bgColors[code]);
            }
        }
    }
    
    result += `<span style="${buildStyle(styles)}">${escapeHtml(text.slice(lastIndex))}</span>`;
    return result;
}

function buildStyle(styles) {
    let css = '';
    for (const s of styles) {
        if (s === 'bold') css += 'font-weight: bold;';
        else if (s === 'italic') css += 'font-style: italic;';
        else if (s === 'underline') css += 'text-decoration: underline;';
        else if (s.startsWith('fg:')) css += `color: ${s.slice(3)};`;
        else if (s.startsWith('bg:')) css += `background-color: ${s.slice(3)};`;
    }
    return css;
}

// ===== TERMINAL =====
function addTerminalLine(message, type = 'info') {
    const container = document.getElementById('terminalContainer');
    const firstLine = container.querySelector('.terminal-line.system');
    if (firstLine && firstLine.textContent === 'Waiting for logs...') container.innerHTML = '';
    
    const line = document.createElement('div');
    line.className = `terminal-line ${type}`;
    
    if (type === 'error' || type === 'info') {
        line.innerHTML = parseAnsi(message);
    } else {
        line.textContent = message;
    }
    
    container.appendChild(line);
    container.scrollTop = container.scrollHeight;
}

async function sendCommand() {
    const input = document.getElementById('terminalInput');
    const cmd = input.value;
    if (!cmd || currentStatus !== 'online') return;
    input.value = '';
    
    addTerminalLine(`$ ${cmd}`, 'user-cmd');
    
    // Отправляем команду через Firebase
    const cmdRef = db.ref(`py/users/${userId}/projects/${currentProjectId}/stdin`);
    await cmdRef.push({
        command: cmd,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    });
}

document.getElementById('terminalInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendCommand();
});

// ===== ENV VARS =====
async function loadEnvVars() {
    const snap = await db.ref(`py/users/${userId}/projects/${currentProjectId}/env`).once('value');
    envVarsCache = snap.val() || {};
    renderEnvList();
}

function renderEnvList() {
    const list = document.getElementById('envList');
    const keys = Object.keys(envVarsCache);
    
    if (keys.length === 0) {
        list.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 20px;">No environment variables</div>';
        return;
    }
    
    list.innerHTML = '';
    keys.forEach(name => {
        const value = envVarsCache[name];
        const item = document.createElement('div');
        item.className = 'env-item';
        item.innerHTML = `
            <div style="flex: 1; min-width: 0;">
                <div class="env-name">${escapeHtml(name)}</div>
                <div class="env-value" data-value="${escapeAttr(value)}" data-shown="false">••••••••</div>
            </div>
            <div class="env-actions">
                <button class="icon-btn" onclick="toggleEnvValue(this)" title="Show/Hide">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button class="icon-btn" onclick="copyEnvValue('${escapeAttr(name)}')" title="Copy">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <button class="icon-btn" onclick="editEnvVar('${escapeAttr(name)}')" title="Edit">
                    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </button>
                <button class="icon-btn" onclick="deleteEnvVar('${escapeAttr(name)}')" title="Delete" style="color: var(--danger);">
                    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>`;
        list.appendChild(item);
    });
}

function escapeAttr(s) {
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toggleEnvValue(btn) {
    const item = btn.closest('.env-item');
    const valueEl = item.querySelector('.env-value');
    const shown = valueEl.dataset.shown === 'true';
    
    if (shown) {
        valueEl.textContent = '••••••••';
        valueEl.classList.remove('shown');
        valueEl.dataset.shown = 'false';
    } else {
        valueEl.textContent = valueEl.dataset.value;
        valueEl.classList.add('shown');
        valueEl.dataset.shown = 'true';
    }
}

async function copyEnvValue(name) {
    const value = envVarsCache[name];
    try {
        await navigator.clipboard.writeText(value);
        alert('Copied!');
    } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = value;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('Copied!');
    }
}

function openEnvModal() {
    document.getElementById('envModal').classList.add('active');
    loadEnvVars();
}

function openEnvVarModal(name = null) {
    editingEnvVar = name;
    document.getElementById('envVarTitle').textContent = name ? 'Edit Variable' : 'Create Variable';
    document.getElementById('envVarName').value = name || '';
    document.getElementById('envVarName').disabled = !!name;
    document.getElementById('envVarValue').value = name ? (envVarsCache[name] || '') : '';
    document.getElementById('envVarModal').classList.add('active');
}

function editEnvVar(name) {
    openEnvVarModal(name);
}

async function saveEnvVar() {
    const name = document.getElementById('envVarName').value.trim();
    const value = document.getElementById('envVarValue').value;
    
    if (!name) { alert('Name cannot be empty'); return; }
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) {
        alert('Invalid variable name. Use letters, digits, underscore.');
        return;
    }
    
    await db.ref(`py/users/${userId}/projects/${currentProjectId}/env/${name}`).set(value);
    closeModal('envVarModal');
    loadEnvVars();
}

async function deleteEnvVar(name) {
    if (!confirm(`Delete variable "${name}"?`)) return;
    await db.ref(`py/users/${userId}/projects/${currentProjectId}/env/${name}`).remove();
    loadEnvVars();
}

// ===== AUTOSAVE =====
let saveTimeout;
document.getElementById('codeEditor').addEventListener('input', () => {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        if (currentProjectRef) {
            const code = document.getElementById('codeEditor').value;
            currentProjectRef.update({ data_py: code });
        }
    }, 1000);
});

document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('active'); });
});

loadLanguage().then(() => loadProjects());
</script>
