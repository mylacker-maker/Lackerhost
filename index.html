<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LackerHost</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
    --bg: #0f1115;
    --surface: #181a20;
    --surface2: #22252e;
    --border: #2a2d38;
    --text: #f2f2f4;
    --text-dim: #8b8f99;
    --accent: #4DA6FF;
    --accent-dim: rgba(77, 166, 255, 0.15);
    --danger: #ff4757;
    --success: #2ed573;
    --warning: #ffa502;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

.hidden { display: none !important; }

.header { padding: 20px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.header-actions { display: flex; gap: 12px; }
.lang-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.lang-btn:hover { border-color: var(--accent); }

.main { flex: 1; overflow-y: auto; padding: 24px; padding-bottom: 100px; }
.projects-header { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

.project-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: all 0.2s; }
.project-card:hover { border-color: var(--accent); background: var(--surface2); }
.project-card:active { transform: scale(0.98); }

.project-icon { width: 48px; height: 48px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.project-icon img { width: 32px; height: 32px; object-fit: contain; }

.project-info { flex: 1; min-width: 0; }
.project-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.project-desc { font-size: 13px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.project-status { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; }
.status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
.status-dot.offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.status-dot.starting { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.status-text { font-size: 13px; font-weight: 600; }
.status-text.online { color: var(--success); }
.status-text.offline { color: var(--danger); }
.status-text.starting { color: var(--warning); }

.fab { position: fixed; bottom: 32px; right: 32px; width: 60px; height: 60px; border-radius: 50%; background: #ffffff; border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 50; }
.fab:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(0,0,0,0.4); }
.fab:active { transform: scale(0.95); }
.fab svg { width: 28px; height: 28px; stroke: #000000; stroke-width: 2.5; }

.editor-view { display: flex; flex-direction: column; height: 100%; }
.editor-toolbar { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.toolbar-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.toolbar-btn:hover { border-color: var(--accent); }
.toolbar-btn:active { transform: scale(0.95); }
.toolbar-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.toolbar-spacer { flex: 1; }

.editor-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#codeEditor { flex: 1; width: 100%; padding: 20px; background: var(--bg); color: var(--text); border: none; outline: none; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.6; resize: none; tab-size: 4; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 20px; }
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; transform: scale(0.9); transition: transform 0.3s; }
.modal-overlay.active .modal { transform: scale(1); }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 8px; }
.form-input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
.form-input:focus { border-color: var(--accent); }
.form-select { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 14px; outline: none; cursor: pointer; }

.modal-btn { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: all 0.2s; text-align: left; }
.modal-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
.modal-btn:active { transform: scale(0.98); }
.modal-btn.danger { border-color: var(--danger); }
.modal-btn.danger:hover { background: rgba(255, 71, 87, 0.1); }
.modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; text-align: center; }

.logs-container { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; max-height: 400px; overflow-y: auto; }
.log-line { margin-bottom: 4px; word-break: break-word; }
.log-line.error { color: var(--danger); }
.log-line.info { color: var(--accent); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.empty-state-text { font-size: 14px; }
</style>
</head>
<body>

<div id="mainView">
    <div class="header">
        <div class="logo">LackerHost</div>
        <div class="header-actions">
            <button class="lang-btn" id="langBtn" onclick="openLangModal()">ENG</button>
        </div>
    </div>
    <div class="main">
        <div class="projects-header" data-i18n="projects">Projects</div>
        <div id="projectsList"></div>
        <div id="emptyState" class="empty-state hidden">
            <div class="empty-state-title" data-i18n="noProjects">No projects</div>
            <div class="empty-state-text" data-i18n="createFirst">Create your first project</div>
        </div>
    </div>
    <button class="fab" onclick="openCreateModal()">
        <svg viewBox="0 0 24 24" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
</div>

<div id="editorView" class="hidden editor-view">
    <div class="editor-toolbar">
        <button class="toolbar-btn" onclick="goBack()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            <span data-i18n="back">Back</span>
        </button>
        <button class="toolbar-btn" onclick="openToolsModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            <span data-i18n="tools">Tools</span>
        </button>
        <button class="toolbar-btn" onclick="openLogsModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span data-i18n="logs">Logs</span>
        </button>
        <div class="toolbar-spacer"></div>
        <button class="toolbar-btn primary" id="runBtn" onclick="toggleProject()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span id="runBtnText" data-i18n="run">Run</span>
        </button>
    </div>
    <div class="editor-container">
        <textarea id="codeEditor" placeholder="# Enter your Python code here..."></textarea>
    </div>
</div>

<div class="modal-overlay" id="createModal">
    <div class="modal">
        <div class="modal-title" data-i18n="createProject">Create Project</div>
        <div class="form-group">
            <label class="form-label" data-i18n="projectName">Project Name</label>
            <input type="text" class="form-input" id="projectNameInput" maxlength="20" placeholder="my-project">
        </div>
        <div class="form-group">
            <label class="form-label" data-i18n="topic">Topic</label>
            <select class="form-select" id="projectTypeSelect">
                <option value="python">Python</option>
            </select>
        </div>
        <button class="modal-btn primary" onclick="createProject()" data-i18n="create">Create</button>
        <button class="modal-btn" onclick="closeModal('createModal')" data-i18n="cancel">Cancel</button>
    </div>
</div>

<div class="modal-overlay" id="langModal">
    <div class="modal">
        <div class="modal-title" data-i18n="selectLanguage">Select Language</div>
        <button class="modal-btn" onclick="setLanguage('en')">English</button>
        <button class="modal-btn" onclick="setLanguage('ru')">Русский</button>
        <button class="modal-btn" onclick="setLanguage('uk')">Українська</button>
        <button class="modal-btn" onclick="closeModal('langModal')" data-i18n="cancel">Cancel</button>
    </div>
</div>

<div class="modal-overlay" id="toolsModal">
    <div class="modal">
        <div class="modal-title" data-i18n="tools">Tools</div>
        <button class="modal-btn danger" onclick="clearAndStop()" data-i18n="clearAndStop">Clear code and stop</button>
        <button class="modal-btn danger" onclick="deleteProject()" data-i18n="deleteProject">Delete project</button>
        <button class="modal-btn" onclick="closeModal('toolsModal')" data-i18n="cancel">Cancel</button>
    </div>
</div>

<div class="modal-overlay" id="logsModal">
    <div class="modal">
        <div class="modal-title" data-i18n="logs">Logs</div>
        <div class="logs-container" id="logsContainer">
            <div class="log-line info" data-i18n="waitingLogs">Waiting for logs...</div>
        </div>
        <button class="modal-btn" onclick="closeModal('logsModal')" style="margin-top: 16px;" data-i18n="close">Close</button>
    </div>
</div>

<script>
const firebaseConfig = { databaseURL: "https://lackerteam-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const translations = {
    en: {
        projects: "Projects",
        noProjects: "No projects",
        createFirst: "Create your first project",
        back: "Back",
        tools: "Tools",
        logs: "Logs",
        run: "Run",
        stop: "Stop",
        starting: "Starting...",
        createProject: "Create Project",
        projectName: "Project Name",
        topic: "Topic",
        create: "Create",
        cancel: "Cancel",
        selectLanguage: "Select Language",
        clearAndStop: "Clear code and stop",
        deleteProject: "Delete project",
        waitingLogs: "Waiting for logs...",
        close: "Close",
        pythonProject: "Python project",
        nameExists: "Project name already exists",
        nameEmpty: "Project name cannot be empty",
        confirmClear: "Clear code and stop project?",
        confirmDelete: "Delete project? This action cannot be undone."
    },
    ru: {
        projects: "Проекты",
        noProjects: "Нет проектов",
        createFirst: "Создайте свой первый проект",
        back: "Назад",
        tools: "Инструменты",
        logs: "Логи",
        run: "Запустить",
        stop: "Остановить",
        starting: "Запуск...",
        createProject: "Создать проект",
        projectName: "Имя проекта",
        topic: "Тематика",
        create: "Создать",
        cancel: "Отмена",
        selectLanguage: "Выберите язык",
        clearAndStop: "Очистить код и остановить",
        deleteProject: "Удалить проект",
        waitingLogs: "Ожидание логов...",
        close: "Закрыть",
        pythonProject: "Python проект",
        nameExists: "Имя проекта уже существует",
        nameEmpty: "Имя проекта не может быть пустым",
        confirmClear: "Очистить код и остановить проект?",
        confirmDelete: "Удалить проект? Это действие нельзя отменить."
    },
    uk: {
        projects: "Проекти",
        noProjects: "Немає проектів",
        createFirst: "Створіть свій перший проект",
        back: "Назад",
        tools: "Інструменти",
        logs: "Логи",
        run: "Запустити",
        stop: "Зупинити",
        starting: "Запуск...",
        createProject: "Створити проект",
        projectName: "Ім'я проекту",
        topic: "Тематика",
        create: "Створити",
        cancel: "Скасувати",
        selectLanguage: "Виберіть мову",
        clearAndStop: "Очистити код і зупинити",
        deleteProject: "Видалити проект",
        waitingLogs: "Очікування логів...",
        close: "Закрити",
        pythonProject: "Python проект",
        nameExists: "Ім'я проекту вже існує",
        nameEmpty: "Ім'я проекту не може бути порожнім",
        confirmClear: "Очистити код і зупинити проект?",
        confirmDelete: "Видалити проект? Цю дію не можна скасувати."
    }
};

let currentLang = 'en';
let userId = null;
let currentProjectId = null;
let currentProjectRef = null;
let logsListener = null;

const urlParams = new URLSearchParams(window.location.search);
userId = urlParams.get('id');

if (!userId) {
    alert('User ID not specified in URL');
}

function t(key) {
    return translations[currentLang][key] || translations['en'][key] || key;
}

function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
    });
    
    const langBtn = document.getElementById('langBtn');
    langBtn.textContent = currentLang.toUpperCase();
}

async function loadLanguage() {
    const langSnap = await db.ref(`py/users/${userId}/lang`).once('value');
    currentLang = langSnap.val() || 'en';
    applyTranslations();
}

function setLanguage(lang) {
    currentLang = lang;
    db.ref(`py/users/${userId}/lang`).set(lang);
    applyTranslations();
    closeModal('langModal');
}

function openLangModal() {
    document.getElementById('langModal').classList.add('active');
}

function loadProjects() {
    const projectsRef = db.ref(`py/users/${userId}/projects`);
    projectsRef.on('value', snapshot => {
        const projects = snapshot.val() || {};
        renderProjects(projects);
    });
}

function renderProjects(projects) {
    const list = document.getElementById('projectsList');
    const emptyState = document.getElementById('emptyState');
    list.innerHTML = '';
    
    const projectIds = Object.keys(projects);
    
    if (projectIds.length === 0) {
        emptyState.classList.remove('hidden');
        return;
    }
    
    emptyState.classList.add('hidden');
    
    projectIds.forEach(projectId => {
        const project = projects[projectId];
        const card = document.createElement('div');
        card.className = 'project-card';
        card.onclick = () => openProject(projectId);
        
        const status = project.status || 'offline';
        const statusClass = status;
        const statusText = status === 'online' ? 'online' : status === 'starting' ? 'starting' : 'offline';
        
        card.innerHTML = `
            <div class="project-icon">
                <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/python.svg" alt="Python" style="filter: invert(1);">
            </div>
            <div class="project-info">
                <div class="project-name">${projectId}</div>
                <div class="project-desc">${t('pythonProject')}</div>
            </div>
            <div class="project-status">
                <div class="status-dot ${statusClass}"></div>
                <div class="status-text ${statusText}">${statusText}</div>
            </div>
        `;
        
        list.appendChild(card);
    });
}

function openCreateModal() {
    document.getElementById('projectNameInput').value = '';
    document.getElementById('createModal').classList.add('active');
}

async function createProject() {
    const name = document.getElementById('projectNameInput').value.trim();
    const type = document.getElementById('projectTypeSelect').value;
    
    if (!name) {
        alert(t('nameEmpty'));
        return;
    }
    
    const projectsRef = db.ref(`py/users/${userId}/projects`);
    const snapshot = await projectsRef.once('value');
    const projects = snapshot.val() || {};
    
    if (projects[name]) {
        alert(t('nameExists'));
        return;
    }
    
    await projectsRef.child(name).set({
        type: type,
        status: 'offline',
        data_py: '',
        created: firebase.database.ServerValue.TIMESTAMP
    });
    
    closeModal('createModal');
}

function openProject(projectId) {
    currentProjectId = projectId;
    currentProjectRef = db.ref(`py/users/${userId}/projects/${projectId}`);
    
    document.getElementById('mainView').classList.add('hidden');
    document.getElementById('editorView').classList.remove('hidden');
    
    currentProjectRef.once('value').then(snapshot => {
        const project = snapshot.val() || {};
        document.getElementById('codeEditor').value = project.data_py || '';
        updateRunButton(project.status || 'offline');
    });
    
    currentProjectRef.on('value', snapshot => {
        const project = snapshot.val() || {};
        updateRunButton(project.status || 'offline');
    });
    
    if (logsListener) logsListener();
    
    const logsRef = db.ref(`py/users/${userId}/projects/${projectId}/logs`);
    logsListener = logsRef.on('child_added', snapshot => {
        const log = snapshot.val();
        addLog(log.message, log.type);
    });
}

function updateRunButton(status) {
    const btn = document.getElementById('runBtn');
    const text = document.getElementById('runBtnText');
    
    if (status === 'online' || status === 'starting') {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg><span id="runBtnText">${t('stop')}</span>`;
    } else {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg><span id="runBtnText">${t('run')}</span>`;
    }
}

function toggleProject() {
    const statusText = document.getElementById('runBtnText').textContent;
    
    if (statusText === t('run')) {
        startProject();
    } else {
        stopProject();
    }
}

function startProject() {
    const code = document.getElementById('codeEditor').value;
    
    currentProjectRef.update({
        data_py: code,
        status: 'starting'
    });
    
    setTimeout(() => {
        currentProjectRef.update({
            status: 'online'
        });
    }, 1000);
}

function stopProject() {
    currentProjectRef.update({
        status: 'offline'
    });
}

function goBack() {
    const code = document.getElementById('codeEditor').value;
    currentProjectRef.update({
        data_py: code
    });
    
    if (logsListener) {
        db.ref(`py/users/${userId}/projects/${currentProjectId}/logs`).off('child_added', logsListener);
        logsListener = null;
    }
    
    currentProjectRef.off();
    currentProjectRef = null;
    currentProjectId = null;
    
    document.getElementById('editorView').classList.add('hidden');
    document.getElementById('mainView').classList.remove('hidden');
    
    document.getElementById('logsContainer').innerHTML = `<div class="log-line info">${t('waitingLogs')}</div>`;
}

function openToolsModal() {
    document.getElementById('toolsModal').classList.add('active');
}

function openLogsModal() {
    document.getElementById('logsModal').classList.add('active');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

function clearAndStop() {
    if (!confirm(t('confirmClear'))) return;
    
    document.getElementById('codeEditor').value = '';
    currentProjectRef.update({
        data_py: '',
        status: 'offline'
    });
    
    closeModal('toolsModal');
}

function deleteProject() {
    if (!confirm(t('confirmDelete'))) return;
    
    currentProjectRef.remove().then(() => {
        closeModal('toolsModal');
        goBack();
    });
}

function addLog(message, type = 'info') {
    const container = document.getElementById('logsContainer');
    const firstLog = container.querySelector('.log-line.info');
    if (firstLog && firstLog.textContent === t('waitingLogs')) {
        container.innerHTML = '';
    }
    
    const logLine = document.createElement('div');
    logLine.className = `log-line ${type}`;
    logLine.textContent = message;
    container.appendChild(logLine);
    container.scrollTop = container.scrollHeight;
}

let saveTimeout;
document.getElementById('codeEditor').addEventListener('input', () => {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        if (currentProjectRef) {
            const code = document.getElementById('codeEditor').value;
            currentProjectRef.update({
                data_py: code
            });
        }
    }, 1000);
});

document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
            overlay.classList.remove('active');
        }
    });
});

loadLanguage().then(() => {
    loadProjects();
});
</script>

</body>
</html>
